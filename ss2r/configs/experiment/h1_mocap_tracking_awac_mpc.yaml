# @package _global_
defaults:
  - override /environment: h1_mocap_tracking
  - override /agent: awac_mpc
  - _self_

environment:
  task_params:
    loco:
      dataset_name: dance1_subject3

training:
  num_envs: 64
  num_timesteps: 5000000
  safe: false
  num_eval_episodes: 1
  train_domain_randomization: false
  eval_domain_randomization: false

agent:
  max_replay_size: 1048576
  grad_updates_per_step: 64 
  batch_size: 512
  policy_hidden_layer_sizes: [256, 256, 256]
  value_hidden_layer_sizes: [512, 512]  # two block of BroNet
  discounting: 0.95
